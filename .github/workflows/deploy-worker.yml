name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar arquivos
        run: |
          echo "=== Estrutura ==="
          ls -la
          echo "=== wrangler.toml ==="
          cat wrangler.toml
          echo "=== worker.js (primeiras linhas) ==="
          head -20 worker.js
          echo "=== index.html (existe?) ==="
          ls -la index.html || echo "index.html NÃO EXISTE"

      - name: Instalar Wrangler
        run: npm install -g wrangler@3.90.0

      - name: Deploy
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
