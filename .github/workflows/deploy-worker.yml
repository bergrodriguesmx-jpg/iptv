name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets
        run: |
          echo "Token length: ${#TOKEN}"
          echo "Account length: ${#ACCOUNT}"
          if [ -z "$TOKEN" ]; then echo "❌ TOKEN VAZIO"; else echo "✅ TOKEN OK"; fi
          if [ -z "$ACCOUNT" ]; then echo "❌ ACCOUNT VAZIO"; else echo "✅ ACCOUNT OK"; fi
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
